name: Build course description PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - materials/course-description/**
      - "!materials/course-description/course-description.pdf"
      - .github/workflows/build-course-description.yml
  pull_request:
    paths:
      - materials/course-description/**
      - "!materials/course-description/course-description.pdf"
      - .github/workflows/build-course-description.yml

permissions:
  contents: write

concurrency:
  group: course-description-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XeLaTeX and Persian support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-lang-arabic \
            texlive-fonts-recommended texlive-science texlive-pictures \
            fonts-noto-core lmodern

      - name: Prepare template assets
        run: |
          mkdir -p materials/course-description/LaTeX_Common/cover
          if [ ! -f materials/course-description/LaTeX_Common/cover/sharif.jpg ]; then
            curl -fL "https://sadrazar.github.io/images/SharifLogo.jpg" \
              -o materials/course-description/LaTeX_Common/cover/sharif.jpg
          fi

      - name: Build PDF
        working-directory: materials/course-description
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Prepare PDF
        run: cp materials/course-description/main.pdf materials/course-description/course-description.pdf

      - name: Commit generated PDF
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not let an older build overwrite a PDF for newer source.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced while this run was building; a newer run will publish the PDF"
            exit 0
          fi

          git add materials/course-description/course-description.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date"
          else
            git commit -m "Build course description PDF"
            git push origin HEAD:main
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: advanced-networks-course-description
          path: materials/course-description/course-description.pdf
          if-no-files-found: error
