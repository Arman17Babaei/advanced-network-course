name: Build course description PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - materials/course-description/main.tex
      - materials/course-description/README.md
      - .github/workflows/build-course-description.yml
  pull_request:
    paths:
      - materials/course-description/main.tex
      - materials/course-description/README.md
      - .github/workflows/build-course-description.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install XeLaTeX and Persian support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-lang-arabic \
            texlive-fonts-recommended fonts-noto-core lmodern

      - name: Build PDF
        working-directory: materials/course-description
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex

      - name: Prepare PDF
        run: cp materials/course-description/main.pdf materials/course-description/course-description.pdf

      - name: Commit generated PDF
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/course-description/course-description.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date"
          else
            git commit -m "Build course description PDF"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: advanced-networks-course-description
          path: materials/course-description/course-description.pdf
          if-no-files-found: error
