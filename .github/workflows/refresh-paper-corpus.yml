name: Freeze remaining Transactions snapshots

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/build_paper_corpus.py
      - tools/research/export_transaction_journal.py
      - tools/research/validate_transaction_journal.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Export validated journals sequentially
        shell: bash
        run: |
          set -e
          journals=(
            "IEEE Transactions on Cloud Computing"
            "IEEE Transactions on Communications"
            "IEEE Transactions on Dependable and Secure Computing"
            "IEEE Transactions on Green Communications and Networking"
            "IEEE Transactions on Multimedia"
            "IEEE Transactions on Parallel and Distributed Systems"
            "IEEE Transactions on Wireless Communications"
          )
          for journal in "${journals[@]}"; do
            echo "===== EXPORTING: $journal ====="
            python tools/research/export_transaction_journal.py --journal "$journal"
            sleep 5
          done
      - name: Commit validated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/assessments/data/transactions/*.csv
          if git diff --cached --quiet; then
            echo "No Transactions snapshot changes"
          else
            git commit -m "Refresh validated networking Transactions snapshots"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
