name: Validate IPDPS source

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/build_paper_corpus.py
      - tools/research/validate_venue.py
      - tools/research/export_validated_venue.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate IPDPS
        run: python tools/research/validate_venue.py --venue IPDPS --live
      - name: Export IPDPS
        run: python tools/research/export_validated_venue.py --venue IPDPS
      - name: Commit IPDPS snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/assessments/data/venues/ipdps.csv
          if git diff --cached --quiet; then
            echo "No IPDPS snapshot changes"
          else
            git commit -m "Refresh validated IPDPS snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
