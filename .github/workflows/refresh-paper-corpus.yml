name: Validate paper source

concurrency:
  group: paper-source-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - research/refresh-project-idea-pool-2023-2026
    paths:
      - tools/research/build_paper_corpus.py
      - tools/research/validate_venue.py
      - tools/research/export_validated_venue.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate ICNP source
        run: python tools/research/validate_venue.py --venue ICNP
      - name: Export ICNP snapshot
        run: python tools/research/export_validated_venue.py --venue ICNP
      - name: Commit ICNP snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/assessments/data/venues/icnp.csv
          if git diff --cached --quiet; then
            echo "No ICNP snapshot changes"
          else
            git commit -m "Refresh validated ICNP snapshot"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
