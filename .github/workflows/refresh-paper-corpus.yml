name: Freeze adjacent Transactions network subsets

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/validate_transaction_journal.py
      - tools/research/export_transaction_journal.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/research/validate_transaction_journal.py --journal "IEEE Transactions on Vehicular Technology"
      - run: python tools/research/validate_transaction_journal.py --journal "IEEE Transactions on Green Communications and Networking"
      - run: python tools/research/validate_transaction_journal.py --journal "IEEE Transactions on Dependable and Secure Computing"
      - run: python tools/research/validate_transaction_journal.py --journal "IEEE Transactions on Network Science and Engineering"
      - run: python tools/research/export_transaction_journal.py --journal "IEEE Transactions on Vehicular Technology"
      - run: python tools/research/export_transaction_journal.py --journal "IEEE Transactions on Green Communications and Networking"
      - run: python tools/research/export_transaction_journal.py --journal "IEEE Transactions on Dependable and Secure Computing"
      - run: python tools/research/export_transaction_journal.py --journal "IEEE Transactions on Network Science and Engineering"
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/assessments/data/transactions/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "Refresh validated adjacent Transactions network subsets"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
