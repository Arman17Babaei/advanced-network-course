name: Validate remaining Transactions journals

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/build_paper_corpus.py
      - tools/research/validate_transaction_journal.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate remaining journals sequentially
        shell: bash
        run: |
          set +e
          failed=0
          journals=(
            "IEEE Transactions on Cloud Computing"
            "IEEE Transactions on Communications"
            "IEEE Transactions on Dependable and Secure Computing"
            "IEEE Transactions on Green Communications and Networking"
            "IEEE Transactions on Multimedia"
            "IEEE Transactions on Parallel and Distributed Systems"
            "IEEE Transactions on Wireless Communications"
          )
          for journal in "${journals[@]}"; do
            echo "===== VALIDATING: $journal ====="
            python tools/research/validate_transaction_journal.py --journal "$journal"
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "===== FAILED: $journal ====="
              failed=1
            else
              echo "===== PASSED: $journal ====="
            fi
          done
          exit $failed
