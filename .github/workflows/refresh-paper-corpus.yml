name: Inspect CoNEXT source

concurrency:
  group: conext-source-inspection-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - research/refresh-project-idea-pool-2023-2026
    paths:
      - tools/research/inspect_conext_source.py
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect official CoNEXT pages
        run: python tools/research/inspect_conext_source.py
