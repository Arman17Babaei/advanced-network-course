name: Validate all IEEE Transactions network papers

concurrency:
  group: transactions-all-${{ github.sha }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/scan_ieee_transactions.py
      - tools/research/validate_transaction_journal.py
      - tools/research/build_paper_corpus.py
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/research/scan_ieee_transactions.py
