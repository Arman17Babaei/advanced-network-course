name: Validate adjacent Transactions network subsets

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/validate_transaction_journal.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        journal:
          - IEEE Transactions on Vehicular Technology
          - IEEE Transactions on Green Communications and Networking
          - IEEE Transactions on Dependable and Secure Computing
          - IEEE Transactions on Network Science and Engineering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/research/validate_transaction_journal.py --journal "${{ matrix.journal }}"
