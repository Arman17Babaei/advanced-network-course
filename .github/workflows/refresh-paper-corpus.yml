name: Repair venue snapshot text

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/fix_snapshot_text.py
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ftfy
      - name: Repair frozen venue snapshots
        run: python tools/research/fix_snapshot_text.py
      - name: Commit repaired snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/assessments/data/venues/*.csv
          if git diff --cached --quiet; then
            echo "No text repairs needed"
          else
            git commit -m "Normalize venue snapshot text"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
