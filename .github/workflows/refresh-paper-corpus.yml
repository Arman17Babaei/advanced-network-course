name: Refresh paper corpus

on:
  workflow_dispatch:
  push:
    branches:
      - research/refresh-project-idea-pool-2023-2026
    paths:
      - tools/research/build_paper_corpus.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Build corpus
        run: python tools/research/build_paper_corpus.py
      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/assessments/data/recent_networking_papers.csv
          git add materials/assessments/data/recent_networking_papers.jsonl
          git add materials/assessments/data/PAPER_CORPUS_SUMMARY.md
          git add materials/assessments/data/PAPER_CORPUS_COVERAGE.csv
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refresh generated paper corpus"
            git push
          fi
