name: Validate paper source

concurrency:
  group: paper-source-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - research/refresh-project-idea-pool-2023-2026
    paths:
      - tools/research/build_paper_corpus.py
      - tools/research/validate_venue.py
      - tools/research/paper_corpus_config.json
      - .github/workflows/refresh-paper-corpus.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate SIGCOMM source
        run: python tools/research/validate_venue.py --venue SIGCOMM
      - name: Validate CoNEXT source
        run: python tools/research/validate_venue.py --venue CoNEXT
      - name: Validate NSDI source
        run: python tools/research/validate_venue.py --venue NSDI
