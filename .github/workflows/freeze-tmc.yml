name: Freeze Mobile Computing network subset

on:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - .github/workflows/freeze-tmc.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Export TMC network subset
        run: python tools/research/export_transaction_journal.py --journal "IEEE Transactions on Mobile Computing"
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/assessments/data/transactions/ieee_transactions_on_mobile_computing.csv
          if git diff --cached --quiet; then
            echo "No TMC snapshot changes"
          else
            git commit -m "Refresh validated Mobile Computing network subset"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
