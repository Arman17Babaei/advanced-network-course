name: Inspect IPDPS DOI families

on:
  push:
    branches:
      - research/refresh-project-idea-pool-2023-2026
    paths:
      - tools/research/inspect_ipdps_doi_family.py
      - .github/workflows/inspect-ipdps-dois.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Inspect exact proceedings DOI records
        run: python tools/research/inspect_ipdps_doi_family.py
