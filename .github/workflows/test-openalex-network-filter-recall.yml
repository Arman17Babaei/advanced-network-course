name: Test OpenAlex network filter recall

on:
  workflow_dispatch:
  push:
    branches: [research/refresh-project-idea-pool-2023-2026]
    paths:
      - tools/research/test_openalex_network_filter_recall.py
      - .github/workflows/test-openalex-network-filter-recall.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/research/test_openalex_network_filter_recall.py
